name: 애드픽 핫딜 텔레그램 알림

# 10분마다 자동 실행 + 수동으로도 실행 가능
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:  # Actions 탭에서 수동으로 "Run workflow" 버튼으로도 실행 가능

# sent_items.json을 저장소에 다시 커밋하기 위해 쓰기 권한 필요
permissions:
  contents: write

jobs:
  check-hotdeals:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install requests

      - name: 핫딜 체크 및 텔레그램 전송
        env:
          ADPICK_AFFID: ${{ secrets.ADPICK_AFFID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hotdeal_telegram_bot.py

      - name: 전송 기록(sent_items.json) 저장소에 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_items.json
          git diff --staged --quiet || git commit -m "update sent items log"
          git push
